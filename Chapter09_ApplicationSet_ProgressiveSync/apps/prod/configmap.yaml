apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  labels: { app: web, env: prod }
data:
  # 👇 CHANGE THIS VERSION (in all 3 envs) to trigger a progressive rollout.
  index.html: |
    <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PROD • Progressive Sync</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
           font-family:system-ui,sans-serif;
           background:radial-gradient(circle at 50% 15%,#ef4444 0%,#dc2626 40%,#7f1d1d 100%);color:#fff1f2}
      .card{padding:3rem 3.75rem;border-radius:22px;background:rgba(0,0,0,.30);
            border:1px solid rgba(255,255,255,.18);text-align:center;max-width:520px;
            box-shadow:0 24px 70px rgba(0,0,0,.5)}
      .tag{display:inline-block;padding:.35rem 1rem;border-radius:999px;font-weight:800;
           letter-spacing:2px;background:#f87171;color:#4c0519;font-size:.8rem}
      .ver{font-size:3.2rem;font-weight:900;margin:.6rem 0}
      h1{margin:.3rem 0;font-size:1.4rem}p{margin:.35rem 0;color:#fecdd3}
      code{background:rgba(255,255,255,.12);padding:.1rem .4rem;border-radius:6px}
    </style></head><body>
      <div class="card"><span class="tag">PROD • wave 3</span>
        <div class="ver">v1.0.0</div>
        <h1>🚀 Prod environment</h1>
        <p>Updates <strong>last</strong> — only after dev and qa are Healthy.</p>
        <p>env: <code>prod</code> • NodePort <code>30083</code></p>
      </div></body></html>

  default.conf: |
    server { listen 80; server_name _; location / { root /usr/share/nginx/html; index index.html; } }
