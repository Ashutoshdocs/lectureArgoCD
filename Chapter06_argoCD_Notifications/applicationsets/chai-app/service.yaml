# chai-app Service — matches the README's port-forward (svc/chai-app-service :3000).
apiVersion: v1
kind: Service
metadata:
  name: chai-app-service
  namespace: default
  labels:
    app: chai-app
spec:
  type: ClusterIP
  selector:
    app: chai-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
