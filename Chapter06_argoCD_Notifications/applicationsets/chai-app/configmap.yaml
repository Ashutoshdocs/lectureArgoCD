apiVersion: v1
kind: ConfigMap
metadata:
  name: chai-app-content
  namespace: default
  labels:
    app: chai-app
data:
  # Custom landing page for the chai-app.
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Chai App ☕</title>
      <style>
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
             font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
             background:linear-gradient(135deg,#3b2417 0%,#6f4e37 100%);color:#f5efe6}
        .card{padding:3rem 3.5rem;border-radius:20px;background:rgba(0,0,0,.25);
              border:1px solid rgba(255,255,255,.12);text-align:center;
              box-shadow:0 20px 60px rgba(0,0,0,.4)}
        h1{margin:0;font-size:2.4rem}
        p{margin:.4rem 0;color:#e7dccb}
        .badge{display:inline-block;margin-top:1.2rem;padding:.4rem 1rem;border-radius:999px;
               background:#c8963e;color:#2a1a0d;font-weight:700}
      </style>
    </head>
    <body>
      <div class="card">
        <h1>☕ Blaze  App</h1>
        <p>Deployed with ArgoCD — GitOps in action.</p>
        <p>Sync &amp; health events are emailed via SMTP notifications.</p>
        <span class="badge">running on :3000</span>
      </div>
    </body>
    </html>

  # nginx vhost so the stock nginx image listens on port 3000 (chai-app-service port).
  default.conf: |
    server {
      listen 3000;
      server_name _;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }
