apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: default
  labels:
    app: web
    env: dev
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>DEV • ArgoCD Multicluster</title>
      <style>
        :root{color-scheme:dark}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
             font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
             background:radial-gradient(circle at 50% 15%,#10b981 0%,#059669 40%,#064e3b 100%);
             color:#ecfdf5}
        .card{padding:3rem 3.75rem;border-radius:22px;background:rgba(0,0,0,.28);
              border:1px solid rgba(255,255,255,.18);text-align:center;
              box-shadow:0 24px 70px rgba(0,0,0,.45);max-width:520px}
        .tag{display:inline-block;padding:.35rem 1rem;border-radius:999px;font-weight:800;
             letter-spacing:2px;background:#34d399;color:#053b2c;font-size:.8rem}
        h1{margin:.9rem 0 .3rem;font-size:3rem;text-shadow:0 2px 20px rgba(52,211,153,.6)}
        p{margin:.35rem 0;color:#d1fae5}
        .meta{margin-top:1.4rem;font-size:.85rem;color:#a7f3d0;border-top:1px solid rgba(255,255,255,.15);padding-top:1rem}
        code{background:rgba(255,255,255,.12);padding:.1rem .4rem;border-radius:6px}
      </style>
    </head>
    <body>
      <div class="card">
        <span class="tag">DEVELOPMENT</span>
        <h1>🌱 Dev Cluster</h1>
        <p>Fast iteration. Break things here, not in prod.</p>
        <p>Deployed by <strong>ArgoCD</strong> — one Git repo, many clusters.</p>
        <div class="meta">
          Environment: <code>dev</code> &nbsp;•&nbsp; App: <code>nginx-dev</code><br/>
          Managed by ArgoCD • GitOps ✨
        </div>
      </div>
    </body>
    </html>

  default.conf: |
    server {
      listen 80;
      server_name _;
      location / { root /usr/share/nginx/html; index index.html; }
    }
