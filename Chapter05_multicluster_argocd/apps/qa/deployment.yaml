apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-qa
  namespace: default
  labels:
    app: web
    env: qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      env: qa
  template:
    metadata:
      labels:
        app: web
        env: qa
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: content
          configMap:
            name: web-content
