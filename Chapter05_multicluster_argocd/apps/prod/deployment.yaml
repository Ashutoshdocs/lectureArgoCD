apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-prod
  namespace: default
  labels:
    app: web
    env: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
      env: prod
  template:
    metadata:
      labels:
        app: web
        env: prod
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 48Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: content
          configMap:
            name: web-content
