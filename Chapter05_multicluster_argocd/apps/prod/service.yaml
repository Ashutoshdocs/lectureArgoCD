apiVersion: v1
kind: Service
metadata:
  name: nginx-prod
  namespace: default
  labels:
    app: web
    env: prod
spec:
  type: NodePort
  selector:
    app: web
    env: prod
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080   # access at http://<prod-vm-ip>:30080
