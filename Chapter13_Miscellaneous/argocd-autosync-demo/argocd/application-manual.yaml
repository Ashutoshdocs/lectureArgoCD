apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ashutoshdocs/argocd-autosync-demo.git
    targetRevision: HEAD
    path: Chapter13_Miscellaneous/argocd-autosync-demo/argocd/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  # No "automated" block: Argo CD only detects drift and waits for a manual sync.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
