# SKIP hook: this file lives in Git but Argo CD never applies it.
# Typical use: a placeholder or local-only secret that another tool
# (Sealed Secrets, External Secrets, a human) manages in the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: local-secret
  annotations:
    argocd.argoproj.io/hook: Skip
type: Opaque
stringData:
  password: "only-for-local-dev"
