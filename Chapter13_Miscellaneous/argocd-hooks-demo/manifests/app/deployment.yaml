apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
