apiVersion: batch/v1
kind: Job
metadata:
  name: app-sync-job
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0            # fail fast so the demo doesn't retry for minutes
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: app-sync-job
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "[Sync | wave 1] Runs after wave 0 (ConfigMap, Deployment, Service) is healthy"
              echo "[Sync | wave 1] Warming config / registering app..."
              sleep 5
              echo "[Sync | wave 1] Done"
