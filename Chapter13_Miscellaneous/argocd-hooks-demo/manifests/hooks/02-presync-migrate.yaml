apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-presync
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0            # fail fast so the demo doesn't retry for minutes
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-migration-presync
          image: busybox:1.36
          env:
            # Part 4: set to "true", commit, push and sync to see SyncFail run
            - name: SIMULATE_FAILURE
              value: "false"
          command: ["sh", "-c"]
          args:
            - |
              echo "[PreSync | wave 0] Running database migrations..."
              sleep 5
              if [ "$SIMULATE_FAILURE" = "true" ]; then
                echo "[PreSync | wave 0] ERROR: migration 0042_add_orders failed" >&2
                exit 1
              fi
              echo "[PreSync | wave 0] Migrations applied: 0041, 0042"
