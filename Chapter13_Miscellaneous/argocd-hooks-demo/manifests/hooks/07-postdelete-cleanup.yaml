apiVersion: batch/v1
kind: Job
metadata:
  name: cleanup-after-delete
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0            # fail fast so the demo doesn't retry for minutes
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: cleanup-after-delete
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "[PostDelete] Application and its resources are deleted"
              echo "[PostDelete] Cleaning up external resources (DNS records, S3 buckets, DB users)..."
              sleep 5
              echo "[PostDelete] Cleanup complete"
