apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
  annotations:
    # ---- Email-only notification subscriptions ----
    # Format: subscribe.<trigger>.<service>: <recipient>
    # "gmail" is the email service named in argocd-notifications-cm.yaml.
    # Replace the address with your recipient.
    notifications.argoproj.io/subscribe.on-sync-succeeded.gmail: team@example.com
    notifications.argoproj.io/subscribe.on-sync-failed.gmail: team@example.com
    notifications.argoproj.io/subscribe.on-health-degraded.gmail: team@example.com
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ashutoshdocs/lectureArgoCD.git
    targetRevision: main
    path: Chapter05_argoCD_Notifications_Email/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: notify-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
