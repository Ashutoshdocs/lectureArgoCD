# ArgoCD Notifications configuration — EMAIL ONLY (no Slack).
# Applied into the `argocd` namespace. The notifications controller (bundled with
# ArgoCD) reads this ConfigMap for the email service, triggers and templates, and
# reads the SMTP username/password from `argocd-notifications-secret`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # ---------------------------------------------------------------------------
  # SERVICE — SMTP email. Gmail shown; change host/port for another provider.
  # ---------------------------------------------------------------------------
  service.email.gmail: |
    username: $email-username
    password: $email-password
    host: smtp.gmail.com
    port: 587
    from: $email-username

  # ---------------------------------------------------------------------------
  # TEMPLATES — email subject + body for each event.
  # ---------------------------------------------------------------------------
  template.app-sync-succeeded: |
    email:
      subject: "✅ {{.app.metadata.name}} synced successfully"
    message: |
      Application {{.app.metadata.name}} is now Synced.

      Sync status : {{.app.status.sync.status}}
      Health      : {{.app.status.health.status}}
      Revision    : {{.app.status.sync.revision}}

  template.app-sync-failed: |
    email:
      subject: "❌ {{.app.metadata.name}} sync FAILED"
    message: |
      Application {{.app.metadata.name}} sync is {{.app.status.operationState.phase}}.

      Message: {{.app.status.operationState.message}}

  template.app-health-degraded: |
    email:
      subject: "⚠️ {{.app.metadata.name}} health DEGRADED"
    message: |
      Application {{.app.metadata.name}} health is {{.app.status.health.status}}.

  # ---------------------------------------------------------------------------
  # TRIGGERS — the condition that fires a template.
  # ---------------------------------------------------------------------------
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      oncePer: app.status.sync.revision
      send: [app-sync-succeeded]

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]

  defaultTriggers: |
    - on-sync-succeeded
    - on-sync-failed
    - on-health-degraded
