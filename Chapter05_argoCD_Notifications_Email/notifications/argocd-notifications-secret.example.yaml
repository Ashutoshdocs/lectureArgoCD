# SMTP credentials for the email service. Referenced from the ConfigMap as
# $email-username and $email-password.
#
# ⚠️ DO NOT commit real secrets to Git. This file is a TEMPLATE — either fill it
#    in locally and keep it out of Git (.gitignore), or better, create the secret
#    imperatively (see README step 3) so credentials never touch the repo.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  # For Gmail use an App Password (Google Account → Security → App passwords),
  # NOT your normal login password.
  email-username: "you@gmail.com"
  email-password: "REPLACE-WITH-APP-PASSWORD"
