# CANARY = the new version (v2) exposed to a small slice of live traffic.
# Increase its replicas (and/or decrease stable) to shift more traffic to v2.
# To fully promote: set canary image=v1 back OR make stable use v2 and remove canary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-canary
  namespace: stable-canary
  labels:
    app: canary-demo
    track: canary
spec:
  replicas: 1          # ~20% of traffic with 4 stable replicas
  selector:
    matchLabels:
      app: canary-demo
      track: canary
  template:
    metadata:
      labels:
        app: canary-demo
        track: canary
    spec:
      containers:
        - name: hello
          image: gcr.io/google-samples/hello-app:2.0   # v2
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
