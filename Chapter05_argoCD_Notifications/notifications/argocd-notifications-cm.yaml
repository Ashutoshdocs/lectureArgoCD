# ArgoCD Notifications configuration.
# Applied into the `argocd` namespace. The notifications controller (bundled with
# ArgoCD) reads this ConfigMap for services, triggers and templates, and reads
# tokens/passwords from the `argocd-notifications-secret`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # ---------------------------------------------------------------------------
  # SERVICES — where notifications are sent. Secrets are referenced as $token etc.
  # ---------------------------------------------------------------------------
  service.slack: |
    token: $slack-token

  service.email.gmail: |
    username: $email-username
    password: $email-password
    host: smtp.gmail.com
    port: 587
    from: $email-username

  # ---------------------------------------------------------------------------
  # TEMPLATES — the message body for each notification.
  # ---------------------------------------------------------------------------
  template.app-sync-succeeded: |
    email:
      subject: "✅ {{.app.metadata.name}} synced successfully"
    message: |
      Application *{{.app.metadata.name}}* is now *Synced*.
      Revision: {{.app.status.sync.revision}}
      Sync status: {{.app.status.sync.status}}
      Health: {{.app.status.health.status}}
    slack:
      attachments: |
        [{
          "title": "{{.app.metadata.name}}",
          "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "color": "#18be52",
          "fields": [
            {"title": "Sync Status", "value": "{{.app.status.sync.status}}", "short": true},
            {"title": "Health", "value": "{{.app.status.health.status}}", "short": true},
            {"title": "Revision", "value": "{{.app.status.sync.revision}}", "short": false}
          ]
        }]

  template.app-sync-failed: |
    email:
      subject: "❌ {{.app.metadata.name}} sync FAILED"
    message: |
      Application *{{.app.metadata.name}}* sync is *{{.app.status.operationState.phase}}*.
      Message: {{.app.status.operationState.message}}
    slack:
      attachments: |
        [{
          "title": "{{.app.metadata.name}}",
          "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "color": "#e01e5a",
          "fields": [
            {"title": "Phase", "value": "{{.app.status.operationState.phase}}", "short": true},
            {"title": "Message", "value": "{{.app.status.operationState.message}}", "short": false}
          ]
        }]

  template.app-health-degraded: |
    email:
      subject: "⚠️ {{.app.metadata.name}} health DEGRADED"
    message: |
      Application *{{.app.metadata.name}}* health is *{{.app.status.health.status}}*.
    slack:
      attachments: |
        [{
          "title": "{{.app.metadata.name}}",
          "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "color": "#f4c430",
          "fields": [
            {"title": "Health", "value": "{{.app.status.health.status}}", "short": true}
          ]
        }]

  # ---------------------------------------------------------------------------
  # TRIGGERS — the condition that fires a template.
  # ---------------------------------------------------------------------------
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      oncePer: app.status.sync.revision
      send: [app-sync-succeeded]

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]

  # Optional: default triggers applied when a subscription names no trigger.
  defaultTriggers: |
    - on-sync-succeeded
    - on-sync-failed
    - on-health-degraded
