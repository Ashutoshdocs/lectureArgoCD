# Tokens/passwords for the notification services. Referenced from the ConfigMap
# as $slack-token, $email-username, $email-password.
#
# ⚠️ DO NOT commit real secrets to Git. This file is a TEMPLATE — either fill it
#    in locally and keep it out of Git (.gitignore), or better, create the secret
#    imperatively (see README step 4) so tokens never touch the repo.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  # Slack Bot User OAuth Token (starts with xoxb-...) with chat:write scope.
  slack-token: "xoxb-REPLACE-ME"
  # SMTP creds. For Gmail use an App Password (not your normal password).
  email-username: "you@gmail.com"
  email-password: "REPLACE-WITH-APP-PASSWORD"
