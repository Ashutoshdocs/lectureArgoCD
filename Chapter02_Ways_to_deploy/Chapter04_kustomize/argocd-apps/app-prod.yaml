# ArgoCD Application: deploys overlays/prod -> namespace prod, NodePort 30082
# Prod is MANUAL sync on purpose: you review the diff in ArgoCD, then click Sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ashutoshdocs/lectureArgoCD.git
    targetRevision: main
    path: Chapter02_Ways_to_deploy/Chapter04_kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
