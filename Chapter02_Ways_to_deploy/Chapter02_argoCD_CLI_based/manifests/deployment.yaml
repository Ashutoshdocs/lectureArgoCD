apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-nginx-demo
  namespace: cli-nginx-demo
  labels:
    app: cli-nginx-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cli-nginx-demo
  template:
    metadata:
      labels:
        app: cli-nginx-demo
    spec:
      containers:
        - name: cli-nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: html
          configMap:
            name: cli-nginx-index-html
