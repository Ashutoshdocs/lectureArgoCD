apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  labels: { app: web, tier: cluster-demo }
data:
  index.html: |
    <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cluster Generator • ApplicationSets</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
           font-family:system-ui,sans-serif;
           background:radial-gradient(circle at 50% 15%,#8b5cf6 0%,#6d28d9 40%,#3b0764 100%);color:#f5f3ff}
      .card{padding:3rem 3.75rem;border-radius:22px;background:rgba(0,0,0,.28);
            border:1px solid rgba(255,255,255,.18);text-align:center;max-width:540px;
            box-shadow:0 24px 70px rgba(0,0,0,.45)}
      .tag{display:inline-block;padding:.35rem 1rem;border-radius:999px;font-weight:800;
           letter-spacing:2px;background:#c4b5fd;color:#3b0764;font-size:.8rem}
      h1{margin:.9rem 0 .3rem;font-size:2.6rem}p{margin:.35rem 0;color:#ede9fe}
      code{background:rgba(255,255,255,.12);padding:.1rem .4rem;border-radius:6px}
      .meta{margin-top:1.4rem;font-size:.85rem;color:#ddd6fe;border-top:1px solid rgba(255,255,255,.15);padding-top:1rem}
    </style></head><body>
      <div class="card"><span class="tag">CLUSTER GENERATOR</span>
        <h1>🛰️ One app, every cluster</h1>
        <p>This same page was templated onto <strong>every registered cluster</strong>
           by the ApplicationSet <em>cluster</em> generator.</p>
        <div class="meta">source: <code>cluster-app/</code> • generator: <code>clusters: {}</code></div>
      </div></body></html>

  default.conf: |
    server { listen 80; server_name _; location / { root /usr/share/nginx/html; index index.html; } }
