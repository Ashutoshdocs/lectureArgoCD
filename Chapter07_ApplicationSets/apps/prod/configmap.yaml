apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  labels: { app: web, env: prod }
data:
  index.html: |
    <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PROD • ApplicationSets</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
           font-family:system-ui,sans-serif;
           background:radial-gradient(circle at 50% 15%,#ef4444 0%,#dc2626 40%,#7f1d1d 100%);color:#fff1f2}
      .card{padding:3rem 3.75rem;border-radius:22px;background:rgba(0,0,0,.30);
            border:1px solid rgba(255,255,255,.18);text-align:center;max-width:520px;
            box-shadow:0 24px 70px rgba(0,0,0,.5)}
      .tag{display:inline-block;padding:.35rem 1rem;border-radius:999px;font-weight:800;
           letter-spacing:2px;background:#f87171;color:#4c0519;font-size:.8rem}
      h1{margin:.9rem 0 .3rem;font-size:3rem}p{margin:.35rem 0;color:#fecdd3}
      code{background:rgba(255,255,255,.12);padding:.1rem .4rem;border-radius:6px}
      .meta{margin-top:1.4rem;font-size:.85rem;color:#fda4af;border-top:1px solid rgba(255,255,255,.15);padding-top:1rem}
    </style></head><body>
      <div class="card"><span class="tag">PRODUCTION</span>
        <h1>🚀 Prod</h1>
        <p>Generated by an <strong>ApplicationSet</strong> — one template, many apps.</p>
        <div class="meta">env: <code>prod</code> • path: <code>apps/prod</code></div>
      </div></body></html>

  default.conf: |
    server { listen 80; server_name _; location / { root /usr/share/nginx/html; index index.html; } }
