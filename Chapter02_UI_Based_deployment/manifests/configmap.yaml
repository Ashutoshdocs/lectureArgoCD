apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-index-html
  namespace: nginx-demo
  labels:
    app: nginx-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Nginx on ArgoCD</title>
      <style>
        :root { color-scheme: light dark; }
        body {
          margin: 0;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          background: linear-gradient(135deg, #0b1120 0%, #1e293b 100%);
          color: #e2e8f0;
        }
        .card {
          text-align: center;
          padding: 3rem 3.5rem;
          border-radius: 20px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid rgba(255, 255, 255, 0.08);
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        h1 { margin: 0 0 0.5rem; font-size: 2rem; }
        p { margin: 0.25rem 0; color: #94a3b8; }
        .badge {
          display: inline-block;
          margin-top: 1.25rem;
          padding: 0.4rem 1rem;
          border-radius: 999px;
          background: #10b981;
          color: #052e1a;
          font-weight: 600;
          font-size: 0.85rem;
        }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>🚀 Deployed with ArgoCD</h1>
        <p>This nginx page is served from a Kubernetes ConfigMap.</p>
        <p>GitOps: what's in Git is what's running.</p>
        <span class="badge">Sync Status: Healthy</span>
      </div>
    </body>
    </html>
