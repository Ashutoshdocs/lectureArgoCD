# PostSync HOOK: runs AFTER all waves are synced AND the app is Healthy.
# Classic use: smoke test / integration check / notify that the release is live.
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
  namespace: waves-demo
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  template:
    metadata:
      name: smoke-test
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[PostSync] 🧪 Smoke-testing the service...";
              # hit the in-cluster Service that wave 2 created
              if wget -qO- --timeout=5 http://web.waves-demo.svc.cluster.local >/dev/null; then
                echo "[PostSync] ✅ Service responded. Release verified.";
              else
                echo "[PostSync] ⚠️ Service not reachable yet."; exit 1;
              fi
