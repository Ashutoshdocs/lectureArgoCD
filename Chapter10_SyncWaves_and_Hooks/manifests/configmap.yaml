apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: waves-demo
  labels: { app: web }
  annotations:
    argocd.argoproj.io/sync-wave: "0"     # WAVE 0: config exists before the Deployment
data:
  index.html: |
    <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sync Waves & Hooks</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
           font-family:system-ui,sans-serif;
           background:radial-gradient(circle at 50% 12%,#6366f1 0%,#4338ca 42%,#1e1b4b 100%);color:#eef2ff}
      .card{padding:2.6rem 3rem;border-radius:22px;background:rgba(0,0,0,.28);
            border:1px solid rgba(255,255,255,.18);text-align:center;max-width:620px;
            box-shadow:0 24px 70px rgba(0,0,0,.45)}
      .tag{display:inline-block;padding:.35rem 1rem;border-radius:999px;font-weight:800;
           letter-spacing:2px;background:#a5b4fc;color:#1e1b4b;font-size:.8rem}
      h1{margin:.7rem 0 .3rem;font-size:2rem}p{margin:.3rem 0;color:#dbe1ff}
      .flow{margin:1.3rem 0 .3rem;font-size:.9rem;text-align:left;display:inline-block;line-height:1.9}
      code{background:rgba(255,255,255,.12);padding:.1rem .45rem;border-radius:6px}
      .b{color:#c7d2fe;font-weight:700}
    </style></head><body>
      <div class="card"><span class="tag">SYNC WAVES + HOOKS</span>
        <h1>🌊 Ordered rollout, one app</h1>
        <div class="flow">
          <span class="b">PreSync hook</span> → run DB migration job ⏳<br/>
          <span class="b">Wave -1</span> → Namespace<br/>
          <span class="b">Wave 0</span> → ConfigMap (this page)<br/>
          <span class="b">Wave 1</span> → Deployment (nginx)<br/>
          <span class="b">Wave 2</span> → Service (NodePort)<br/>
          <span class="b">PostSync hook</span> → smoke-test job ✅
        </div>
        <p>ArgoCD applies each wave in order, waiting for health between them.</p>
        <p>NodePort <code>30090</code></p>
      </div></body></html>

  default.conf: |
    server { listen 80; server_name _; location / { root /usr/share/nginx/html; index index.html; } }
