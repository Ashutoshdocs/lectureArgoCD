apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: waves-demo
  labels: { app: web }
  annotations:
    argocd.argoproj.io/sync-wave: "2"     # WAVE 2: expose only after pods are up
spec:
  type: NodePort
  selector: { app: web }
  ports:
    - { name: http, port: 80, targetPort: 80, nodePort: 30090 }   # http://<node-ip>:30090
