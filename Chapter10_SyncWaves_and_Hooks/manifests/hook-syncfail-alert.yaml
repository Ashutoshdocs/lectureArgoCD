# SyncFail HOOK: runs only if the sync operation FAILS.
# Classic use: alert / rollback trigger / cleanup on a failed release.
apiVersion: batch/v1
kind: Job
metadata:
  name: on-sync-fail
  namespace: waves-demo
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  template:
    metadata:
      name: on-sync-fail
    spec:
      restartPolicy: Never
      containers:
        - name: alert
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[SyncFail] ❌ Sync failed — this is where you'd page on-call or trigger a rollback.";
