apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-nginx
  labels:
    app: alpha-nginx
    team: alpha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alpha-nginx
  template:
    metadata:
      labels:
        app: alpha-nginx
        team: alpha
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
