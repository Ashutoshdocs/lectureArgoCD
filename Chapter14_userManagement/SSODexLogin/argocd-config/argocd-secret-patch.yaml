# Stores the LDAP bind password inside argocd-secret.
# dex.config refers to it as  $dex.ldap.bindPW  so the password never
# appears in the argocd-cm ConfigMap.
#
# Must equal LDAP_READONLY_USER_PASSWORD in ldap/secret.yaml
#
#   kubectl -n argocd patch secret argocd-secret --patch-file argocd-config/argocd-secret-patch.yaml
stringData:
  dex.ldap.bindPW: "Readonly@123"
