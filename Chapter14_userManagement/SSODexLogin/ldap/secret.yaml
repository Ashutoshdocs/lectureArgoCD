# Passwords for the demo OpenLDAP server.
#   admin    -> full LDAP admin (used only by you, for ldapmodify demos)
#   readonly -> service account Dex binds with to SEARCH users and groups
#
# The readonly password MUST match dex.ldap.bindPW in
# argocd-config/argocd-secret-patch.yaml
apiVersion: v1
kind: Secret
metadata:
  name: openldap-credentials
  namespace: ldap
type: Opaque
stringData:
  LDAP_ADMIN_PASSWORD: "Admin@123"
  LDAP_CONFIG_PASSWORD: "Config@123"
  LDAP_READONLY_USER_PASSWORD: "Readonly@123"
