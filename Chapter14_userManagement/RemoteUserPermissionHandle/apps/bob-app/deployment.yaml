apiVersion: apps/v1
kind: Deployment
metadata:
  name: bob-web
  labels:
    app: bob-web
    owner: bob
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bob-web
  template:
    metadata:
      labels:
        app: bob-web
        owner: bob
    spec:
      containers:
        - name: httpd
          image: httpd:2.4-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: web-content
              mountPath: /usr/local/apache2/htdocs
      volumes:
        - name: web-content
          configMap:
            name: bob-web-content
