# AppProject = the "fence" around Bob's work.
# Apps in this project can ONLY:
#   - pull from the lectureArgoCD GitHub repo
#   - deploy to namespace bob-ns on the local cluster
#   - create Deployments, Services and ConfigMaps (no cluster-scoped objects)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bob-project
  namespace: argocd
spec:
  description: Bob's project - may only deploy into bob-ns
  sourceRepos:
    - https://github.com/Ashutoshdocs/lectureArgoCD.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: bob-ns
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
