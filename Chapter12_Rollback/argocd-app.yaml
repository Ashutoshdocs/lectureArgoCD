apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-rollback
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Ashutoshdocs/lectureArgoCD.git
    targetRevision: HEAD
    path: rollback

  destination:
    server: https://kubernetes.default.svc
    namespace: rollback-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
