apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-demo

  template:
    metadata:
      labels:
        app: nginx-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.27

          ports:
            - containerPort: 80

          # Serve the page that comes from index.html (via the ConfigMap)
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true

      volumes:
        - name: html
          configMap:
            # Kustomize rewrites this name to the hashed ConfigMap it generates,
            # e.g. nginx-html-abc123. When index.html changes, the hash changes,
            # this reference changes, and the Deployment rolls out automatically.
            name: nginx-html
