apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recreate-downtime-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/YOUR_REPO.git
    targetRevision: main
    path: deployment-strategies-demo/recreate-downtime/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: recreate-downtime
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
