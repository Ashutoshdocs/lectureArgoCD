apiVersion: v1
kind: Service
metadata:
  name: canary-demo
  namespace: stable-canary
spec:
  type: NodePort
  # Selects BOTH tracks. Kubernetes load-balances across all matching pods,
  # so the traffic split follows the ratio of stable:canary replicas.
  selector:
    app: canary-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30084     # browser: http://<node-ip>:30084 (refresh repeatedly)
