# blaze-app Service — matches the README's port-forward (svc/blaze-app-service :3000).
apiVersion: v1
kind: Service
metadata:
  name: blaze-app-service
  namespace: default
  labels:
    app: blaze-app
spec:
  type: ClusterIP
  selector:
    app: blaze-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
