apiVersion: v1
kind: ConfigMap
metadata:
  name: blaze-app-content
  namespace: default
  labels:
    app: blaze-app
data:
  # Custom landing page for the blaze-app.
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Blaze App 🔥</title>
      <style>
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
             font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
             background:radial-gradient(circle at 50% 20%,#ff8a00 0%,#e52d27 45%,#7a1500 100%);
             color:#fff5ec}
        .card{padding:3rem 3.5rem;border-radius:20px;background:rgba(0,0,0,.28);
              border:1px solid rgba(255,255,255,.18);text-align:center;
              box-shadow:0 20px 60px rgba(0,0,0,.5)}
        h1{margin:0;font-size:2.8rem;text-shadow:0 2px 18px rgba(255,140,0,.7)}
        p{margin:.4rem 0;color:#ffe8d6}
        .badge{display:inline-block;margin-top:1.2rem;padding:.45rem 1.1rem;border-radius:999px;
               background:#ffce54;color:#5a1a00;font-weight:800;letter-spacing:.3px}
        .flame{font-size:1.4rem}
      </style>
    </head>
    <body>
      <div class="card">
        <h1>🔥 Blaze App</h1>
        <p class="flame">Ignite your deployments with GitOps.</p>
        <p>Powered by ArgoCD — sync &amp; health events are emailed via SMTP notifications.</p>
        <span class="badge">running on :3000</span>
      </div>
    </body>
    </html>

  # nginx vhost so the stock nginx image listens on port 3000 (blaze-app-service port).
  default.conf: |
    server {
      listen 3000;
      server_name _;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }
