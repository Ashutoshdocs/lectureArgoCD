apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: frontend-demo
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80          # service port (in-cluster)
      targetPort: 3000  # container port
      nodePort: 30080   # external port on every node (range 30000-32767)
