# GitHub token for the Pull Request generator to list PRs.
# ⚠️ DO NOT commit a real token. Create it imperatively (see README) or fill this
#    in locally — it's in .gitignore.
#
# Token scope: public repo → a classic PAT with `public_repo` (or fine-grained
# read-only "Pull requests"). Private repo → `repo`.
apiVersion: v1
kind: Secret
metadata:
  name: github-token
  namespace: argocd
  labels:
    # Lets the ApplicationSet controller use it as a repo/SCM credential.
    argocd.argoproj.io/secret-type: repo-creds
type: Opaque
stringData:
  token: "ghp_REPLACE_ME"
