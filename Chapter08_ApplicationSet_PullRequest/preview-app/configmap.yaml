apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  labels: { app: web, tier: preview }
data:
  index.html: |
    <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PR Preview • ApplicationSets</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
           font-family:system-ui,sans-serif;
           background:radial-gradient(circle at 50% 15%,#06b6d4 0%,#0e7490 40%,#083344 100%);color:#ecfeff}
      .card{padding:3rem 3.75rem;border-radius:22px;background:rgba(0,0,0,.28);
            border:1px solid rgba(255,255,255,.18);text-align:center;max-width:560px;
            box-shadow:0 24px 70px rgba(0,0,0,.45)}
      .tag{display:inline-block;padding:.35rem 1rem;border-radius:999px;font-weight:800;
           letter-spacing:2px;background:#67e8f9;color:#083344;font-size:.8rem}
      h1{margin:.9rem 0 .3rem;font-size:2.6rem}p{margin:.35rem 0;color:#cffafe}
      code{background:rgba(255,255,255,.12);padding:.1rem .4rem;border-radius:6px}
      .meta{margin-top:1.4rem;font-size:.85rem;color:#a5f3fc;border-top:1px solid rgba(255,255,255,.15);padding-top:1rem}
    </style></head><body>
      <div class="card"><span class="tag">PR PREVIEW</span>
        <h1>🔀 Preview Environment</h1>
        <p>This app was created automatically for an <strong>open pull request</strong>.</p>
        <p>Edit this page <em>in your PR branch</em> and push — the preview updates to
           show your branch's version. Merge/close the PR → this env is destroyed.</p>
        <div class="meta">source: <code>preview-app/</code> • generator: <code>pullRequest</code></div>
      </div></body></html>

  default.conf: |
    server { listen 80; server_name _; location / { root /usr/share/nginx/html; index index.html; } }
