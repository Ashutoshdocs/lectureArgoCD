apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: sync-demo
  labels: { app: web }
data:
  index.html: |
    <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sync Options • Self-Heal & Prune</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
           font-family:system-ui,sans-serif;
           background:radial-gradient(circle at 50% 12%,#0ea5e9 0%,#0369a1 42%,#082f49 100%);color:#f0f9ff}
      .card{padding:2.6rem 3rem;border-radius:22px;background:rgba(0,0,0,.28);
            border:1px solid rgba(255,255,255,.18);text-align:center;max-width:640px;
            box-shadow:0 24px 70px rgba(0,0,0,.45)}
      .tag{display:inline-block;padding:.35rem 1rem;border-radius:999px;font-weight:800;
           letter-spacing:2px;background:#7dd3fc;color:#082f49;font-size:.8rem}
      h1{margin:.7rem 0 .3rem;font-size:2rem}p{margin:.3rem 0;color:#e0f2fe}
      .grid{margin:1.2rem 0 .2rem;text-align:left;display:inline-block;line-height:1.9;font-size:.92rem}
      code{background:rgba(255,255,255,.12);padding:.1rem .45rem;border-radius:6px}
      .b{color:#bae6fd;font-weight:700}
    </style></head><body>
      <div class="card"><span class="tag">SYNC OPTIONS</span>
        <h1>🛡️ Self-Heal &amp; ♻️ Prune</h1>
        <div class="grid">
          <span class="b">selfHeal</span> → revert manual cluster edits back to Git<br/>
          <span class="b">prune</span> → delete resources removed from Git<br/>
          <span class="b">Prune=false</span> → protect a resource from pruning<br/>
          <span class="b">ignoreDifferences</span> → let some fields drift (e.g. replicas/HPA)<br/>
          <span class="b">CreateNamespace / PruneLast / Replace…</span> → sync behaviour knobs
        </div>
        <p>Try to fight Git — ArgoCD wins. That's the demo.</p>
        <p>NodePort <code>30095</code></p>
      </div></body></html>

  default.conf: |
    server { listen 80; server_name _; location / { root /usr/share/nginx/html; index index.html; } }
